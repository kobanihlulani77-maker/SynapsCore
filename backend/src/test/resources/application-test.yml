spring:
  datasource:
    url: jdbc:h2:mem:synapsecore-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  session:
    store-type: none
  task:
    scheduling:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,ping
  health:
    redis:
      enabled: false

synapsecore:
  access:
    allow-header-fallback: true
  security:
    rate-limit:
      enabled: false
  dashboard:
    cache-enabled: false
  # use the default diagnostics window for tests (24h)
  integration:
    pull-worker:
      enabled: false
    replay:
      max-attempts: 2
      backoff-seconds: 0
