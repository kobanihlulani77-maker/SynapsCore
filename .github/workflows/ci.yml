name: SynapseCore CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare Compose validation inputs
        shell: bash
        run: |
          mkdir -p infrastructure/env/ci
          : > infrastructure/env/backend.env
          : > infrastructure/env/frontend.env
          : > infrastructure/env/ci/backend.prod.selfhost.env
          : > infrastructure/env/ci/frontend.prod.selfhost.env

      - name: Validate development Compose config
        working-directory: infrastructure
        run: docker compose config >/dev/null

      - name: Validate production Compose config
        working-directory: infrastructure
        run: >-
          BACKEND_ENV_FILE=./env/ci/backend.prod.selfhost.env
          FRONTEND_ENV_FILE=./env/ci/frontend.prod.selfhost.env
          docker compose -f docker-compose.prod.yml config >/dev/null

  dispatch-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: synapsecore_dispatch_test
          POSTGRES_USER: synapsecore_test
          POSTGRES_PASSWORD: synapsecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapsecore_test -d synapsecore_dispatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prove dispatch claim and reclaim on PostgreSQL
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/synapsecore_dispatch_test
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: synapsecore_test
          SPRING_DATASOURCE_PASSWORD: synapsecore_test
        run: ./mvnw -B -Dtest=OperationalDispatchClaimIntegrationTest,PlatformActivityReadIndexPostgresProof test
