name: SynapseCore CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare Compose validation inputs
        shell: bash
        run: |
          mkdir -p infrastructure/env/ci
          : > infrastructure/env/backend.env
          : > infrastructure/env/frontend.env
          : > infrastructure/env/ci/backend.prod.selfhost.env
          : > infrastructure/env/ci/frontend.prod.selfhost.env

      - name: Validate development Compose config
        working-directory: infrastructure
        run: docker compose config >/dev/null

      - name: Validate production Compose config
        working-directory: infrastructure
        run: >-
          BACKEND_ENV_FILE=./env/ci/backend.prod.selfhost.env
          FRONTEND_ENV_FILE=./env/ci/frontend.prod.selfhost.env
          docker compose -f docker-compose.prod.yml config >/dev/null

  dispatch-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: synapsecore_dispatch_test
          POSTGRES_USER: synapsecore_test
          POSTGRES_PASSWORD: synapsecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapsecore_test -d synapsecore_dispatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prove dispatch recovery after OS-killed worker
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/synapsecore_dispatch_test
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: synapsecore_test
          SPRING_DATASOURCE_PASSWORD: synapsecore_test
        run: |
          set -euo pipefail
          key="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          marker="$RUNNER_TEMP/dispatch-worker-$key.pid"
          log="$RUNNER_TEMP/dispatch-worker-$key.log"
          timeout 240s ./mvnw -B \
            -Dtest=OperationalDispatchProcessKillPostgresProof#claimAndBlock \
            -Dsynapsecore.process-kill-proof=true \
            -Dsynapsecore.process-kill-key="$key" \
            -Dsynapsecore.process-kill-pid-file="$marker" test >"$log" 2>&1 &
          maven_pid=$!
          for attempt in $(seq 1 180); do
            if [[ -s "$marker" ]]; then break; fi
            if ! kill -0 "$maven_pid" 2>/dev/null; then tail -n 80 "$log"; exit 1; fi
            sleep 1
          done
          if [[ ! -s "$marker" ]]; then tail -n 80 "$log"; exit 1; fi
          worker_pid=$(cat "$marker")
          if [[ ! "$worker_pid" =~ ^[0-9]+$ ]]; then tail -n 80 "$log"; exit 1; fi
          kill -0 "$worker_pid"
          kill -KILL "$worker_pid"
          set +e
          wait "$maven_pid"
          maven_status=$?
          set -e
          if [[ "$maven_status" -eq 0 ]]; then tail -n 80 "$log"; exit 1; fi
          echo "Killed test worker PID $worker_pid after its committed claim; Maven exited $maven_status."
          tail -n 15 "$log"
          ./mvnw -B \
            -Dtest=OperationalDispatchProcessKillPostgresProof#reclaimAfterKill \
            -Dsynapsecore.process-kill-proof=true \
            -Dsynapsecore.process-kill-key="$key" \
            -Dsynapsecore.process-kill-pid-file="$marker" test

      - name: Prove dispatch claim and reclaim on PostgreSQL
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/synapsecore_dispatch_test
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: synapsecore_test
          SPRING_DATASOURCE_PASSWORD: synapsecore_test
        run: ./mvnw -B -Dtest=OperationalDispatchClaimIntegrationTest,OperationalDispatchTerminalWritePostgresProof,PlatformActivityReadIndexPostgresProof test
